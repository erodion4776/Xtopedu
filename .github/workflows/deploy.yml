name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Set Supabase Secrets
        run: |
          supabase secrets set \
            WHATSAPP_API_URL="${{ secrets.WHATSAPP_API_URL }}" \
            WHATSAPP_PHONE_NUMBER_ID="${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" \
            WHATSAPP_ACCESS_TOKEN="${{ secrets.WHATSAPP_ACCESS_TOKEN }}" \
            WHATSAPP_WEBHOOK_VERIFY_TOKEN="${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" \
            WHATSAPP_DISPLAY_NUMBER="${{ secrets.WHATSAPP_DISPLAY_NUMBER }}" \
            PAYSTACK_SECRET_KEY="${{ secrets.PAYSTACK_SECRET_KEY }}" \
            APP_URL="${{ secrets.APP_URL }}" \
            SUPER_ADMIN_PHONE="${{ secrets.SUPER_ADMIN_PHONE }}" \
            SUPER_ADMIN_API_TOKEN="${{ secrets.SUPER_ADMIN_API_TOKEN }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            AI_PROVIDER="${{ secrets.AI_PROVIDER }}" \
            TEST_SEND_SECRET="${{ secrets.TEST_SEND_SECRET }}" \
            --project-ref nigloptmadtmsfjqshvm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy whatsapp-webhook \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm

          supabase functions deploy payment-callback \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm

          supabase functions deploy attendance-notify \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm

          supabase functions deploy super-admin-api \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm

          supabase functions deploy send-test \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm

          supabase functions deploy fee-reminder-cron \
            --no-verify-jwt \
            --project-ref nigloptmadtmsfjqshvm || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

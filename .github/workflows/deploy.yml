name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy whatsapp-webhook --no-verify-jwt
          supabase functions deploy payment-callback --no-verify-jwt
          supabase functions deploy attendance-notify --no-verify-jwt
          supabase functions deploy fee-reminder-cron --no-verify-jwt
          supabase functions deploy super-admin-api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: nigloptmadtmsfjqshvm

name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Set Supabase Secrets
        run: |
          supabase secrets set WHATSAPP_API_URL="${{ secrets.WHATSAPP_API_URL }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set WHATSAPP_PHONE_NUMBER_ID="${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set WHATSAPP_ACCESS_TOKEN="${{ secrets.WHATSAPP_ACCESS_TOKEN }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set WHATSAPP_WEBHOOK_VERIFY_TOKEN="${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set MARKETING_WA_PHONE_NUMBER_ID="${{ secrets.MARKETING_WA_PHONE_NUMBER_ID }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set MARKETING_WA_ACCESS_TOKEN="${{ secrets.MARKETING_WA_ACCESS_TOKEN }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set MARKETING_WA_WEBHOOK_VERIFY_TOKEN="${{ secrets.MARKETING_WA_WEBHOOK_VERIFY_TOKEN }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set PAYSTACK_SECRET_KEY="${{ secrets.PAYSTACK_SECRET_KEY }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set APP_URL="${{ secrets.APP_URL }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set SUPER_ADMIN_PHONE="${{ secrets.SUPER_ADMIN_PHONE }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set SUPER_ADMIN_API_TOKEN="${{ secrets.SUPER_ADMIN_API_TOKEN }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set CRON_SECRET="${{ secrets.CRON_SECRET }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" --project-ref nigloptmadtmsfjqshvm
          supabase secrets set AI_PROVIDER="groq" --project-ref nigloptmadtmsfjqshvm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy whatsapp-webhook --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
          supabase functions deploy payment-callback --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
          supabase functions deploy attendance-notify --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
          supabase functions deploy fee-reminder-cron --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
          supabase functions deploy super-admin-api --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
          supabase functions deploy marketing-webhook --no-verify-jwt --project-ref nigloptmadtmsfjqshvm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
